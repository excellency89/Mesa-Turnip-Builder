name: Build Turnip

on:
  workflow_dispatch:

jobs:
 build:
    runs-on: ubuntu-latest

    env:
      TERM: xterm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt update
          sudo apt install -y \
            curl \
            wget \
            unzip \
            zip \
            python3 \
            python3-pip \
            python3-venv \
            meson \
            ninja-build \
            clang \
            llvm \
            lld \
            cmake \
            build-essential \
            pkg-config \
            flex \
            bison \
            glslang-tools \
            patchelf

      - name: Show environment
        run: |
          echo "TERM=$TERM"
          uname -a
          pwd
          ls -la

      - name: Make script executable
        run: chmod +x build-turnip.sh

      - name: Build Turnip
        run: |
          export TERM=xterm
          ./build-turnip.sh

      - name: Show generated files
        if: always()
        run: |
          find . -name "*.zip"
          find . -name "libvulkan_freedreno.so"

      - name: Upload Turnip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Turnip
          path: |
            **/*.zip
            **/libvulkan_freedreno.so
